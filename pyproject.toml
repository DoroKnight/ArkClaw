[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arkclaw"
version = "0.1.0"
description = "A local-first Windows desktop AI pet."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [
  { name = "ArkClaw Contributors" },
]
dependencies = [
    "openai==2.48.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]
gui = [
  "PySide6==6.11.1",
]
packaging = [
  "Nuitka==4.0",
]

[project.scripts]
arkclaw-agent-demo = "arkclaw.__main__:main"

[project.gui-scripts]
arkclaw-gui = "arkclaw.presentation.qt.application:run"
arkclaw-pet = "arkclaw.presentation.qt.pet_application:run"
arkclaw-pet-placeholder = "arkclaw.presentation.qt.pet_application:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "src",
  "tests",
  "scripts",
  "packaging",
]
mypy_path = "src"
exclude = '''(?x)(
  ^build/
  | ^dist/
  | ^packaging/deployment/
  | ^\.venv/
  | ^\.venv-packaging/
)'''
